services:
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      edge-tts:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      # Without this the prod profile never loads and application-prod.yml is inert:
      # Swagger stays public, cookies lose the Secure flag, the dev CSP is served and
      # ddl-auto falls back to none. Requires CORS_ALLOWED_ORIGINS to be set.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-listening-audio}
      TTS_ENABLED: ${TTS_ENABLED:-true}
      EDGE_TTS_URL: http://edge-tts:8000
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: production
    healthcheck:
      # wget, not curl: the runtime stage is eclipse-temurin:17-jre-alpine, which ships
      # wget but not curl. The probe failed on every run since it was written, so the
      # container reported unhealthy even while the application was serving fine — and
      # any depends_on: service_healthy or CD health gate gets stuck on it.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  edge-tts:
    build: ./edge-tts
    restart: always
    ports:
      - "8000:8000"
    environment:
      EDGE_TTS_ENV: production
      EDGE_TTS_CORS_ALLOWED_ORIGINS: ${EDGE_TTS_CORS_ALLOWED_ORIGINS:-}
      EDGE_TTS_ALLOWED_VOICES: ${EDGE_TTS_ALLOWED_VOICES:-en-US-GuyNeural,en-US-AriaNeural,en-GB-RyanNeural,en-GB-SoniaNeural,en-AU-WilliamNeural,en-AU-NatashaNeural}
      EDGE_TTS_MAX_TEXT_LENGTH: ${EDGE_TTS_MAX_TEXT_LENGTH:-5000}
      EDGE_TTS_MAX_REQUEST_BYTES: ${EDGE_TTS_MAX_REQUEST_BYTES:-20000}
      EDGE_TTS_RATE_LIMIT_REQUESTS: ${EDGE_TTS_RATE_LIMIT_REQUESTS:-30}
      EDGE_TTS_RATE_LIMIT_WINDOW_SECONDS: ${EDGE_TTS_RATE_LIMIT_WINDOW_SECONDS:-60}
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # The application does not connect as root. Without these two, a fresh volume comes up
      # with root as its only account and the backend dies on "Access denied" -- which is
      # exactly what happened when this volume was recreated: the app user had only ever
      # existed because someone made it by hand, so the stack could not be rebuilt from
      # scratch. Pointing them at the datasource variables keeps one source of truth for the
      # credential. MySQL rejects MYSQL_USER=root, so leave SPRING_DATASOURCE_USERNAME as a
      # non-root name.
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  mysql-data:
  minio-data:

networks:
  app-network:
    driver: bridge

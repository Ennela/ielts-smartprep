server:
  port: 8080
  # Let in-flight requests finish instead of being cut off mid-response when the container
  # is replaced. A deploy recreates the backend, and without this an exam submission in
  # progress at that moment simply dies.
  shutdown: graceful
  tomcat:
    threads:
      # 100, not the default 200. Threads are only useful to the point where they have
      # something to be scheduled on; past that they cost about 1 MB of stack each, and the
      # production container is capped at 1.5 GB. Requests that touch the database queue on
      # the 20-connection pool below long before 100 threads are exhausted, so the extra 100
      # would buy queueing, not throughput.
      max: 100
      min-spare: 10
    # Requests wait here rather than being refused during a burst.
    accept-count: 100
    max-connections: 2000
    # How long an idle keep-alive connection may hold a thread waiting for the next request.
    connection-timeout: 20s

spring:
  lifecycle:
    # Upper bound on the graceful shutdown above, chosen to sit inside the deploy script's
    # health-wait budget rather than to be generous.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ielts_smartprep}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SmartPrepPool
      # 20 rather than the default 10. The two async executors alone can ask for 15
      # connections (taskExecutor 10 + ttsExecutor 5) before a single HTTP request is
      # served, so the default pool could be fully consumed by background work. 20 still
      # leaves ample headroom under MySQL's default max_connections of 151.
      maximum-pool-size: 20
      minimum-idle: 5
      # Fail in 10 seconds rather than the default 30. A request that has already waited
      # ten seconds for a connection has failed as far as the user is concerned; spending
      # twenty more only holds a Tomcat thread while it does.
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 600000
      # Recycle well inside MySQL's 8-hour wait_timeout so the pool never hands out a
      # connection the server has already dropped.
      max-lifetime: 1200000
      # Log a stack trace for any connection held longer than 30 seconds.
      #
      # This is a diagnostic aimed at a known problem, not a general safety net: four AI
      # entry points still call Gemini inside a transaction (ReadingGenerationService,
      # WritingGenerationService, ListeningGenerationService and
      # WritingService.evaluateAndSaveSubmission), and each will trip this warning under
      # load. That is the intended signal -- it names the offending call site in the log.
      # MockTestAsyncGrader used to be the fifth and worst; it no longer holds a connection
      # across its Gemini calls.
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    # Explicit, and load-bearing rather than merely inherited.
    #
    # The AI endpoints are deliberately not @Transactional, because a transaction there held
    # a pooled connection for the whole Gemini round trip. Several of them still walk lazy
    # associations afterwards -- cloning a template quiz in the Reading fallback, gathering
    # transcripts across a mock test in suggestVocabulary -- and it is open-in-view that
    # keeps an EntityManager available for those, now that no transaction does.
    #
    # Turning this off is therefore not a free tidy-up: it would break those paths with
    # LazyInitializationException. It also silences Spring Boot's warning about relying on
    # the default, which is how this was configured before: by accident.
    #
    # open-in-view keeps the EntityManager open, not a connection -- but only with the
    # handling mode set below. See the comment there.
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        connection:
          # Release the connection when each transaction ends, not when the session closes.
          #
          # Hibernate's own default for JDBC transactions is exactly this, but Spring's
          # HibernateJpaVendorAdapter overrides it with DELAYED_ACQUISITION_AND_HOLD so it can
          # prepare the connection (isolation level, read-only flag) for a transaction. HOLD
          # means "release on session close", and with open-in-view the session is the whole
          # web request. So the read-only transaction behind the first findById in an AI
          # entry point checked out a pooled connection that stayed out across the Gemini
          # round trip -- HikariCP's leak detector fired on a real full-writing submission
          # (issue #13) -- and dropping @Transactional from those methods had removed the
          # transaction but not the hold.
          #
          # Setting the mode here wins over the vendor adapter's value. Transactions still
          # hold their connection until they commit or roll back (AFTER_STATEMENT would not:
          # it releases mid-transaction and breaks commit on a resource-local setup). The
          # cost is that Spring no longer sets the JDBC read-only flag or custom isolation
          # levels on the connection; nothing here declares an isolation level.
          # AiCallConnectionHoldingIntegrationTest asserts both halves through a real request.
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      # Blank by default: a Redis with no requirepass rejects AUTH outright, so sending an
      # empty credential would break every local and CI run. Both Redis clients skip
      # authentication entirely when this is blank -- see RateLimitConfig, which builds its
      # own Lettuce client for Bucket4j and has to be kept in step with this property.
      password: ${SPRING_REDIS_PASSWORD:}
      # Lettuce defaults its command timeout to 60 seconds. Redis here is a container on
      # the same host serving sub-millisecond reads, so 60 seconds is not a timeout, it is
      # a hang -- and these commands sit on the request path for token checks and rate
      # limits. Five seconds is far beyond any healthy response and still fails fast.
      # RateLimitConfig reads the same two properties for the separate Lettuce client it
      # builds for Bucket4j, so the two cannot drift apart.
      timeout: ${SPRING_REDIS_TIMEOUT:5s}
      connect-timeout: ${SPRING_REDIS_CONNECT_TIMEOUT:3s}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  cache:
    type: redis
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # The daily "your words are waiting" email.
  #
  # Off by default, and deliberately so: a machine with no SMTP credentials -- every
  # development machine -- would otherwise try to mail real learners every morning and fill
  # the log with failures. Turn it on only where mail is actually configured.
  vocab-reminder:
    enabled: ${VOCAB_REMINDER_ENABLED:false}
    # Second, minute, hour, day, month, weekday. 07:00 every day.
    cron: ${VOCAB_REMINDER_CRON:0 0 7 * * *}
    # The learners' zone, not the server's, so 07:00 means their morning.
    zone: ${VOCAB_REMINDER_ZONE:Asia/Ho_Chi_Minh}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000  # 15 minutes (access token)
    refresh-expiration-ms: 604800000  # 7 days (refresh token)
  gemini:
    api-key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash
    # Waiting for a response, and waiting for a lease from the connection pool.
    timeout-seconds: 60
    # Establishing the socket, which the timeout above does not cover. Without it an
    # endpoint that accepts no connections falls back to the OS TCP retry behaviour and can
    # block a thread for minutes past every other timeout here.
    connect-timeout-seconds: 10
    max-retries: 3
  tts:
    enabled: ${TTS_ENABLED:true}
    edge-tts-url: ${EDGE_TTS_URL:http://localhost:8000}
    speaking-rate: -8%  # edge-tts rate offset format (-8% matches standard IELTS speed)
    # The sidecar streams from Microsoft's speech endpoint, so a request can legitimately
    # take tens of seconds. The read timeout is therefore a bound rather than a tight one --
    # what matters is that one exists, because RestTemplate's default is to wait forever and
    # a hung call permanently consumed one of ttsExecutor's five threads.
    connect-timeout-seconds: 5
    read-timeout-seconds: 120
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:listening-audio}
  # Mock test result analytics: what counts as weak / developing / strong. Read by
  # AnalyticsThresholdConfig, which is the only place these rules live.
  analytics:
    # Listening and Reading slices classify on accuracy percent.
    accuracy-weak-below: 60
    accuracy-strong-from: 80
    # Writing criteria have no "correct" count, so they classify on the band itself.
    band-weak-below: 5.5
    band-strong-from: 7.0
    # A question-type or part group is only reported as a weakness with at least this many
    # questions; smaller groups still appear in the breakdown but are too noisy to act on.
    min-sample-size: 3
  rate-limit:
    capacity: 10
    refill-tokens: 10
    refill-duration-minutes: 1
    daily-capacity: 50
    auth-login-capacity: 10
    auth-login-refill-minutes: 1
    auth-register-capacity: 5
    auth-register-refill-minutes: 1
  mail:
    from: ${MAIL_USERNAME:noreply@smartprep.com}
  cors:
    # Comma-separated list of allowed origins. Override via CORS_ALLOWED_ORIGINS env var.
    # Defaults to typical local dev origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    swagger-enabled: ${SWAGGER_ENABLED:true}
    secure-cookies: ${SECURE_COOKIES:false}
    # Dev-friendly CSP; production profile overrides with a strict policy.
    csp-policy: >-
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:;
      connect-src 'self' ${FRONTEND_URL:http://localhost:5173} http://localhost:8080
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# --- Sentry ---
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:development}
  traces-sample-rate: 0.2
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: warn

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# --- Swagger / OpenAPI ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# --- Resilience4j Circuit Breaker & Retry ---
resilience4j:
  circuitbreaker:
    instances:
      gemini:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
  timelimiter:
    instances:
      gemini:
        timeoutDuration: 65s
  retry:
    instances:
      gemini:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - com.smartprep.exception.InvalidAiResponseException
          - com.smartprep.exception.AiServiceException

# ============================================================
# Production Profile
# ============================================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
# Flyway remains the sole source of schema migrations.
# ddl-auto: validate ensures JPA entities stay in sync with
# the Flyway-managed schema without ever modifying it.
# ============================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  cors:
    # In production, set CORS_ALLOWED_ORIGINS to your actual domain(s).
    # Example: CORS_ALLOWED_ORIGINS=https://smartprep.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    swagger-enabled: false
    secure-cookies: true
    # Strict CSP for production — no unsafe-inline, no localhost
    csp-policy: >-
      default-src 'self';
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:;
      connect-src 'self' ${FRONTEND_URL}

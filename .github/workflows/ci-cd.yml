name: CI

on:
  push:
    branches: [main, 'codex/**', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # verify, not test: jacoco:check binds to the verify phase, so running `test` meant
      # the coverage gate configured in pom.xml had never once executed. (B-57)
      - name: Run unit tests and coverage gate
        run: ./mvnw --batch-mode verify

  backend-integration-tests:
    # The integration tag is excluded from the default surefire run (pom.xml sets
    # test.tag-expression to !integration), so these never executed in CI. That is how the
    # entities and the Flyway schema drifted apart unnoticed: they are the only tests that
    # boot Spring against a real MySQL with ddl-auto=validate.
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # ubuntu-latest ships a running Docker daemon, which Testcontainers needs to start
      # the MySQL container.
      # jacoco.skip: this profile runs only the ~31 tagged integration tests, so measuring
      # coverage here would report a misleadingly low figure. Coverage is gated in the unit job.
      - name: Run integration tests
        run: ./mvnw --batch-mode -Pintegration-tests -Djacoco.skip=true verify

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker-build:
    # Nothing built the Dockerfiles, so a broken one would only surface at deploy time.
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ielts-smartprep-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ielts-smartprep-frontend:ci ./frontend

      - name: Build edge-tts image
        run: docker build -t ielts-smartprep-edge-tts:ci ./edge-tts

name: CI

on:
  push:
    branches: [main, 'codex/**', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # verify, not test: jacoco:check binds to the verify phase, so running `test` meant
      # the coverage gate configured in pom.xml had never once executed. (B-57)
      - name: Run unit tests and coverage gate
        run: ./mvnw --batch-mode verify

  backend-integration-tests:
    # The integration tag is excluded from the default surefire run (pom.xml sets
    # test.tag-expression to !integration), so these never executed in CI. That is how the
    # entities and the Flyway schema drifted apart unnoticed: they are the only tests that
    # boot Spring against a real MySQL with ddl-auto=validate.
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # ubuntu-latest ships a running Docker daemon, which Testcontainers needs to start
      # the MySQL container.
      # jacoco.skip: this profile runs only the ~31 tagged integration tests, so measuring
      # coverage here would report a misleadingly low figure. Coverage is gated in the unit job.
      - name: Run integration tests
        run: ./mvnw --batch-mode -Pintegration-tests -Djacoco.skip=true verify

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Separate from the build on purpose. `npm run build` is `tsc && vite build`, so type
      # errors did fail CI -- but as a build failure, which reads as a bundling problem. A
      # named step says which of the two actually broke.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker-images:
    # On a pull request this only builds, proving the Dockerfiles still work. On a push to
    # main it also pushes to GHCR, tagged with the commit SHA -- that tag is what the deploy
    # workflow consumes. `latest` moves as well, but only as a convenience for humans: it is
    # never the identifier anything deploys, because it cannot answer "what is running?".
    #
    # This gates on the test jobs rather than running beside them. Publishing an image built
    # from a commit whose tests failed would put a broken artifact in the registry under a
    # SHA that looks exactly as legitimate as any other.
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-integration-tests, frontend-checks]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
          - service: edge-tts
            context: ./edge-tts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to publish
        id: ctx
        env:
          # GHCR rejects an uppercase path, and this repository's owner has one.
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
          # Through the environment, not interpolated into the script. This workflow runs
          # on any feat/** or fix/** branch, and a git ref may legally contain a quote or a
          # semicolon -- so a branch name pasted straight into a [ ... ] test is a command
          # a contributor gets to choose.
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "image=${REGISTRY}/${REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.ctx.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ steps.ctx.outputs.push == 'true' }}
          tags: |
            ${{ steps.ctx.outputs.image }}:${{ github.sha }}
            ${{ steps.ctx.outputs.image }}:latest
          # Vite inlines these at build time, so the DSN has to be present here or the
          # published bundle can never report an error. Blank lines are ignored by the
          # action, so the other two services get no build args at all.
          build-args: |
            ${{ matrix.service == 'frontend' && 'VITE_API_URL=/api/v1' || '' }}
            ${{ matrix.service == 'frontend' && format('VITE_SENTRY_DSN={0}', secrets.VITE_SENTRY_DSN) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

name: Deploy

# Runs after CI succeeds on main, deploying the images that run published for that exact
# commit. It is a separate workflow from CI on purpose: the SSH key and host details live
# only here, so nothing that a pull request can trigger has them in scope.
#
# It is also safe to have merged before any server exists. The `gate` job checks whether
# DEPLOY_HOST is configured and skips cleanly when it is not, so main stays green until
# there is somewhere to deploy to.
#
# Required repository secrets:
#   DEPLOY_HOST         hostname or IP of the VPS
#   DEPLOY_USER         SSH user, a member of the docker group
#   DEPLOY_SSH_KEY      private key for that user (no passphrase)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>` -- pinning this rather than using
#                       StrictHostKeyChecking=no is what stops a spoofed host collecting
#                       the deploy key
# Optional repository variables:
#   DEPLOY_PORT         SSH port (default 22)
#   DEPLOY_PATH         checkout on the server (default /opt/ielts-smartprep)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA to deploy (must already be published by CI)
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Check deployment target
    runs-on: ubuntu-latest
    # A failed CI run must not deploy. workflow_dispatch has no CI run attached, so the
    # conclusion check only applies to the automatic path.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      image_tag: ${{ steps.check.outputs.image_tag }}
    steps:
      - name: Look for a configured server
        id: check
        env:
          # Secrets are not available to job-level `if:`, so the check has to happen in a
          # step and be passed on as an output.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # Via env, never interpolated into the script body: a workflow_dispatch input is
          # attacker-controlled text as far as the shell is concerned.
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::DEPLOY_HOST is not set, so there is no server to deploy to. See the deployment section of the README."
          fi

          tag="${INPUT_TAG:-$RUN_SHA}"
          case "$tag" in
            *[!0-9a-fA-F]* | "")
              echo "::error title=Bad image tag::'$tag' is not a commit SHA."
              exit 1
              ;;
          esac
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    # Attach a GitHub environment so deployments are listed, and so a required reviewer
    # can be added later without touching this file.
    environment:
      name: production
      # Guarded, so an unset APP_DOMAIN variable leaves this blank rather than producing
      # the invalid URL "https://".
      url: ${{ vars.APP_DOMAIN && format('https://{0}', vars.APP_DOMAIN) || '' }}
    permissions:
      contents: read
      # For `docker login ghcr.io` on the server, so private packages can be pulled.
      packages: read

    env:
      IMAGE_TAG: ${{ needs.gate.outputs.image_tag }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ielts-smartprep' }}

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Authenticate the server to the registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Piped over stdin so the token never appears in a command line, an environment
          # variable on the server, or the shell history there.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_USER' --password-stdin"

      - name: Check out the deployed commit on the server
        run: |
          # The compose file, the Caddyfile and the deploy script have to match the images
          # being deployed. Checking out the same SHA is what keeps them in step -- pulling
          # new images against an older compose file is how a deploy silently drops an
          # environment variable that the new code needs.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --quiet origin && git checkout --quiet '$IMAGE_TAG'"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash scripts/deploy.sh '$IMAGE_TAG'"

      - name: Report failure
        if: failure()
        run: |
          echo "::error title=Deployment failed::${IMAGE_TAG} was not deployed. The stack on ${DEPLOY_HOST} is in whatever state the failing step left it, and nothing was rolled back. Read the step log above, then see the rollback section of the README -- note that Flyway migrations are not reverted by redeploying an older tag."
          exit 1

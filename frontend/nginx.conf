server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA: all routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's embedded DNS server. Needed because of the proxy_pass below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy API requests to backend
    location /api/ {
        # The upstream goes through a variable on purpose. With a literal hostname,
        # nginx resolves it once at startup and caches the address forever — so when the
        # backend container is replaced and gets a new IP, nginx keeps sending traffic to
        # the old address and every API call returns 502 until nginx itself is restarted.
        # That happened here: the backend moved to .0.6 while nginx still pointed at .0.4,
        # by then reassigned to edge-tts, which refused the connection. Using a variable
        # forces re-resolution against the resolver above, so a redeploy of the backend no
        # longer takes the frontend down with it.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

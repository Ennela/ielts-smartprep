server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # These matter here rather than on the API. Spring Security sets a CSP, but it only
    # lands on API responses, and a CSP on a JSON body protects nothing — the directive
    # that stops an injected script is the one attached to the HTML document, which is
    # served from this file. Until now that document had no CSP at all.
    #
    # script-src 'self' is the directive doing the real work. The one hash pins the inline
    # theme script in index.html, which has to run before first paint to avoid a flash of
    # the wrong theme; a hash keeps that property without opening script-src to every
    # inline script on the page. If that script is ever edited the hash stops matching and
    # the browser blocks it, which shows up as a console error and the theme flash coming
    # back -- recompute it from the console message and update both copies below.
    #
    # style-src has to keep 'unsafe-inline': 40 components style themselves with React
    # inline style attributes, which CSP treats as inline styles, so a strict style-src
    # would render the app unusable. That is a deliberate weakening of a much less
    # dangerous directive.
    #
    # No Strict-Transport-Security. Nothing terminates TLS at this nginx — it listens on
    # plain 80 behind whatever fronts it — so this is not the place that knows whether
    # HTTPS is in use. HSTS belongs at the TLS edge.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Bypz/eiugL5nXq9jp23vHmEUBK9RsoUD1RZoLjm4uYA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # React SPA: all routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's embedded DNS server. Needed because of the proxy_pass below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy API requests to backend
    location /api/ {
        # The upstream goes through a variable on purpose. With a literal hostname,
        # nginx resolves it once at startup and caches the address forever — so when the
        # backend container is replaced and gets a new IP, nginx keeps sending traffic to
        # the old address and every API call returns 502 until nginx itself is restarted.
        # That happened here: the backend moved to .0.6 while nginx still pointed at .0.4,
        # by then reassigned to edge-tts, which refused the connection. Using a variable
        # forces re-resolution against the resolver above, so a redeploy of the backend no
        # longer takes the frontend down with it.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append. $proxy_add_x_forwarded_for preserves whatever
        # X-Forwarded-For the client sent and appends the real peer after it, so a caller
        # could put a value of its own choosing on the left. The auth rate limiter keys on
        # this header, so a forged entry let one host evade the per-IP limit by varying it
        # per request. Overwriting means the client cannot contribute to it at all.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Repeated on purpose, not by accident. A location block that declares any
        # add_header of its own stops inheriting the server-level ones, so without these
        # four lines every script and stylesheet would be served with no security headers
        # at all — the exact responses where nosniff matters most.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Bypz/eiugL5nXq9jp23vHmEUBK9RsoUD1RZoLjm4uYA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # These matter here rather than on the API. Spring Security sets a CSP, but it only
    # lands on API responses, and a CSP on a JSON body protects nothing — the directive
    # that stops an injected script is the one attached to the HTML document, which is
    # served from this file. Until now that document had no CSP at all.
    #
    # script-src 'self' is the directive doing the real work. The one hash pins the inline
    # theme script in index.html, which has to run before first paint to avoid a flash of
    # the wrong theme; a hash keeps that property without opening script-src to every
    # inline script on the page. If that script is ever edited the hash stops matching and
    # the browser blocks it, which shows up as a console error and the theme flash coming
    # back -- recompute it from the console message and update both copies below.
    #
    # style-src has to keep 'unsafe-inline': 40 components style themselves with React
    # inline style attributes, which CSP treats as inline styles, so a strict style-src
    # would render the app unusable. That is a deliberate weakening of a much less
    # dangerous directive.
    #
    # No Strict-Transport-Security. Nothing terminates TLS at this nginx — it listens on
    # plain 80 behind whatever fronts it — so this is not the place that knows whether
    # HTTPS is in use. HSTS belongs at the TLS edge.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Bypz/eiugL5nXq9jp23vHmEUBK9RsoUD1RZoLjm4uYA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # React SPA: all routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must never be served from cache. Every asset below is fingerprinted and
    # immutable, so index.html is the only thing that changes between deploys -- and it
    # went out with no Cache-Control at all, which lets browsers cache it heuristically
    # from Last-Modified. A returning user then kept the old shell, and with it the old
    # bundle, for hours after a deploy. Seen on 2026-09-20: the frontend image had been
    # rebuilt, yet the browser was still running the previous index-*.js. no-cache still
    # allows a conditional request, so an unchanged shell costs a 304, not a download.
    # The try_files fallback above lands here too: nginx re-matches locations on the
    # internal redirect to /index.html.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Same reason as the asset block: any add_header here drops the server-level ones.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Bypz/eiugL5nXq9jp23vHmEUBK9RsoUD1RZoLjm4uYA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # nginx's mime.types has no entry for wav, so the lobby's headphone check went out as
    # application/octet-stream. Only wav lives here; the types table is per location.
    location /audio/ {
        types { audio/wav wav; }
    }

    # Docker's embedded DNS server. Needed because of the proxy_pass below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy API requests to backend
    #
    # ^~, not a plain prefix. nginx evaluates regex locations before prefix ones, so the
    # static-asset block at the bottom of this file was winning every API path that ends
    # in one of its extensions -- and the only such path is the one the profile page
    # depends on: GET /api/v1/auth/avatar/avatar_2_1790263794339.png. nginx looked for
    # that file under /usr/share/nginx/html, did not find it, and answered with its own
    # 404, so an uploaded profile picture came back as a broken image even though the
    # upload had succeeded and the backend served the file correctly on :8080.
    # ^~ tells nginx to stop at this prefix and skip the regex blocks entirely.
    #
    # Listening audio escaped the same fate only because .mp3 is not in that extension
    # list, which is why this went unnoticed. Production is unaffected: Caddy routes
    # /api/* straight to the backend and never reaches this nginx.
    location ^~ /api/ {
        # The upstream goes through a variable on purpose. With a literal hostname,
        # nginx resolves it once at startup and caches the address forever — so when the
        # backend container is replaced and gets a new IP, nginx keeps sending traffic to
        # the old address and every API call returns 502 until nginx itself is restarted.
        # That happened here: the backend moved to .0.6 while nginx still pointed at .0.4,
        # by then reassigned to edge-tts, which refused the connection. Using a variable
        # forces re-resolution against the resolver above, so a redeploy of the backend no
        # longer takes the frontend down with it.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append. $proxy_add_x_forwarded_for preserves whatever
        # X-Forwarded-For the client sent and appends the real peer after it, so a caller
        # could put a value of its own choosing on the left. The auth rate limiter keys on
        # this header, so a forged entry let one host evade the per-IP limit by varying it
        # per request. Overwriting means the client cannot contribute to it at all.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grading is synchronous: a full Writing submission makes four Gemini calls and
        # takes 70-80 s on a normal day, and each call may retry. nginx's default
        # proxy_read_timeout is 60 s, so the browser got a 504 and "Submission failed"
        # while the backend went on to grade and save the sitting -- and a second click
        # graded it again. Sized for one slow attempt per call, not the theoretical
        # worst case (3 x 65 s x 4), which nobody should wait for anyway. Production
        # goes through Caddy, which sets no read timeout; this only affects the
        # development stack, where this nginx is the proxy.
        proxy_read_timeout 300s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Repeated on purpose, not by accident. A location block that declares any
        # add_header of its own stops inheriting the server-level ones, so without these
        # four lines every script and stylesheet would be served with no security headers
        # at all — the exact responses where nosniff matters most.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Bypz/eiugL5nXq9jp23vHmEUBK9RsoUD1RZoLjm4uYA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
